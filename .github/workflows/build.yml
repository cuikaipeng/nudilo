name: Build and release

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  NUDILO_TEST_ARTIFACTS: ${{ github.workspace }}/build/test-artifacts

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 scripts/release.py check
      - name: Refuse to replace a published release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py guard --tag "$GITHUB_REF_NAME"
      - run: make check
      - run: make race
      - name: Compile all desktop architectures
        env:
          CGO_ENABLED: '0'
        run: |
          for target in darwin/arm64 darwin/amd64 windows/amd64 linux/amd64 linux/arm64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" go build -o "$RUNNER_TEMP/nudilo-check" .
            GOOS="${target%/*}" GOARCH="${target#*/}" go build -o "$RUNNER_TEMP/nudilo-hook-check" ./cmd/callbell-hook
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-previews
          path: build/test-artifacts/
          if-no-files-found: ignore
          retention-days: 7

  package:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: checks
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin/universal
            artifact: macOS
          - os: windows-latest
            platform: windows/amd64
            artifact: windows
          - os: ubuntu-latest
            platform: linux/amd64,linux/arm64
            artifact: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Package and verify
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: ./scripts/package.sh
      - name: Native hook command encoding smoke
        env:
          CGO_ENABLED: '0'
        run: go test ./internal/codex -run TestHookCommandPreservesUTF8 -count=1
      - name: Native startup, language and theme smoke
        if: runner.os == 'macOS'
        run: make test-native
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'macOS'
        with:
          name: native-ui-previews
          path: build/screenshots/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: nudilo-${{ matrix.artifact }}
          path: |
            dist/release/*
            !dist/release/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          pattern: nudilo-*
          path: artifacts
          merge-multiple: true
      - run: python3 scripts/release.py verify artifacts
      - name: Recheck publication state
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py guard --tag "$GITHUB_REF_NAME"
      - name: Prepare bilingual release notes
        run: python3 scripts/release_notes.py > build-release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body_path: build-release-notes.md
          fail_on_unmatched_files: true
          generate_release_notes: false
          draft: true
          prerelease: false
